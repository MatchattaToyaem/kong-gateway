location: australiaeast
resourceGroup: ai-platform
type: Microsoft.App/containerApps
name: kong-gateway
identity:
  type: SystemAssigned
properties:
  environmentId: /subscriptions/53f34d3b-bdc7-4e68-89c4-0e4f1947eb31/resourceGroups/ai-platform/providers/Microsoft.App/managedEnvironments/managedEnvironment-aiplatform-8573
  configuration:
    registries:
      - server: oconnoraiplatform.azurecr.io
        username: oconnoraiplatform
        passwordSecretRef: acr-password
    secrets:
      - name: acr-password
        value:
      - name: jwt-secret
        keyVaultUrl: https://ai-platform-keyvault-01.vault.azure.net/secrets/jwt-secret
        identity: System
      - name: jwt-issuer-uri
        keyVaultUrl: https://ai-platform-keyvault-01.vault.azure.net/secrets/jwt-issuer-uri
        identity: System
    ingress:
      external: true
      targetPort: 8000
      transport: http
      allowInsecure: false
  template:
    containers:
      - name: kong-gateway
        image: oconnoraiplatform.azurecr.io/kong-gateway:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: KONG_DATABASE
            value: "off"
          - name: KONG_DECLARATIVE_CONFIG
            value: "/tmp/kong.yaml"
          - name: KONG_PROXY_LISTEN
            value: "0.0.0.0:8000"
          - name: KONG_ADMIN_LISTEN
            value: "off"
          - name: KONG_LOG_LEVEL
            value: "info"
          - name: JWT_SECRET
            secretRef: jwt-secret
          - name: JWT_ISSUER_URI
            secretRef: jwt-issuer-uri

    scale:
      minReplicas: 1
      maxReplicas: 3
